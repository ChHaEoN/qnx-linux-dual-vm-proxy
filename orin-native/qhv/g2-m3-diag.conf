# qvm guest configuration for diagnostic image m3-d1. Never timed.
#
# Phase 3b, results/orin-native-port/20260909T1100Z/m3-design.md §3.3 and §6.6 D1.
# Comment lines are stripped by make-m3-images.sh; the stripped file must equal
# the stripped g2-m3.conf with exactly the three lines below inserted after its
# first line, or the build fails (generator step PO-E).
#
# Used only when R1 shows qvm alive with no guest output, or output that stops
# with no qvm message. The debug logger level adds qvm's own detail on stderr,
# which the M3 host captures with the guest stream. "unsupported ... abort" makes
# qvm display the failure and the guest state and then terminate, instead of the
# documented defaults (instruction fail, register fail) that deliver an exception
# the guest may never report.
system mkqnximage-guest
logger fatal,internal,error,warn,info,debug stderr
unsupported instruction abort
unsupported register abort
ram 0x80000000,512M
cpu
load /proc/boot/guest-ifs.bin
vdev pl011
 hostdev >-
 loc 0x1c090000
 intr gic:37
vdev virtio-console
 loc 0x20000000
 intr gic:42
 hostdev /dev/ptyp0
vdev virtio-blk
 loc 0x1c0d0000
 intr gic:41
 hostdev /dev/qvmdisk0
 name vblk0
vdev shmem
 loc 0x1c0f0000
 intr gic:43
 allow phase2-rq2-probe
