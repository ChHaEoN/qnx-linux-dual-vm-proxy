# qvm guest configuration for the native leg's M3 runs (images m3-r0, m3-r1, m3-r2).
#
# Phase 3b, results/orin-native-port/20260909T1100Z/m3-design.md §3.3 (revision 2).
# Comment lines never reach the board: make-m3-images.sh strips them into
# orin-native/shim/out/m3/g2-m3.conf, which the image carries as /proc/boot/g2.conf.
#
# This is the configuration the leg runs: the printf in the QNX-generated host
# build tree's post_startup.sh (qhv/host/output/build/, git-ignored).
#
# 2026-09-17 (OD7): the guest and host were regenerated from clean sources, and
# the as-run text now equals the committed scripts/qhv/post_start.custom EXACTLY.
# The four-vdev/three-vdev divergence this header used to describe is gone. The
# fourth vdev -- shmem, with `allow phase2-rq2-probe` -- was an artefact of the
# RQ-2 diagnostic snippet baked into the old build; regenerating necessarily
# drops it, because the staged snippets are already clean and the build copies
# them over. **Owner decision O1, which existed to rule on that inert fourth
# vdev, is answered by construction rather than by judgement.**
#
# The image still carries vdev-shmem.so. Nothing gates the carried .so set
# against the configuration's vdevs, and removing it would perturb Q2_NAMES,
# Q2_SDP_FILES, s1.build.in and the q2 size_check sum -- real risk, no
# functional gain. It is carried and never loaded.
#
# Exactly one line differs from that as-run text: the load path, because the
# native host has no filesystem and carries the guest IFS in its own image. The
# virtio-blk hostdev is unchanged, because devb-loopback keeps prefix=qvmdisk and
# so creates /dev/qvmdisk0 on both legs (design C3). The generator's PO-E gate
# re-derives the as-run text and fails the build if the stripped file differs
# from it in anything but that line.
#
# The disk is back in: the guest's banner is `uname -a`, which exists only on the
# disk's system partition, and its echo server starts only from the disk
# (design C1). The guest IFS is the regenerated one (OD7, 2026-09-17), sha256
# 434647a7cabfe5a1b503fab6c6309894aceccd03d74bb3882ea81caff22a83bd, and its disk
# the regenerated image, sha256
# 55571618524e6cbc7a691b8109734783b479261a2f97206b71fa75f07ee31477.
# It is no longer the byte-identical A1/A3 artefact: OD7 states regeneration is
# not byte-reproducible, and that wording is reworded here rather than repeated.
# Both sizes are unchanged (9,783,916 and 153,432,576 B); only the bytes moved.
system mkqnximage-guest
ram 0x80000000,512M
cpu
load /proc/boot/guest-ifs.bin
vdev pl011
 hostdev >-
 loc 0x1c090000
 intr gic:37
vdev virtio-console
 loc 0x20000000
 intr gic:42
 hostdev /dev/ptyp0
vdev virtio-blk
 loc 0x1c0d0000
 intr gic:41
 hostdev /dev/qvmdisk0
 name vblk0
