# qvm guest configuration for the native leg (M3) — the cloud leg's, minus the disk.
#
# Phase 3b, docs/orin-native-port-plan.md §6.3. Derived from the configuration
# the cloud leg actually runs, which is generated at boot by
# scripts/qhv/post_start.custom; this is that same text with two deliberate
# differences and nothing else, so the guest sees the same machine on both legs
# and the comparison stays about the host.
#
# Difference 1 — no virtio-blk. The cloud leg attaches a disk through
# devb-loopback so the guest has writable storage for the IPC benchmark's
# scratch files. The native leg has no storage driver at all and is not getting
# one: M3's number is launch to guest banner, and the banner does not need a
# disk. Dropping the vdev also drops devb-loopback, the loopback device and the
# 150 MB image from the critical path of the first hardware-timed measurement.
#
# Difference 2 — the guest image comes from /proc/boot. On the cloud leg it is
# read off the host's filesystem; the native leg has no filesystem, so the image
# is built into the IFS and qvm loads it from there.
#
# Everything else is byte-for-byte the cloud leg's: the same 512 MB of guest
# RAM at the same address, the same two vdevs at the same locations with the
# same interrupts, the same pty binding for the console. The guest itself is the
# byte-identical cloud-leg IFS, sha256
# 968029316b940f53580228f44e393877e032e251d78f3c752600cae726a7cf4f (verified
# 2026-09-09 against the plan's claim K11).
#
# What this does not make comparable: the host underneath. The cloud and Orin
# TCG legs run qvm inside QEMU; this one runs it on the metal. That is the whole
# point of the exercise and also the reason the resulting number is a third
# bundle rather than a one-variable diff — see §11 of the plan.

system mkqnximage-guest
ram 0x80000000,512M
cpu
load /proc/boot/guest-ifs.bin
vdev pl011
 hostdev >-
 loc 0x1c090000
 intr gic:37
vdev virtio-console
 loc 0x20000000
 intr gic:42
 hostdev /dev/ptyp0
