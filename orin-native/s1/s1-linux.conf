system s1-linux
logger error,fatal,internal,warn,info stderr
ram 0x80000000,512M
cpu cluster _cpu-1
cpu cluster _cpu-2
cpu cluster _cpu-3
load /data/s1/Image
initrd load /data/s1/initrd.cpio.gz
cmdline "console=hvc0 earlycon=pl011,0x1c090000 keep_bootcon nokaslr rdinit=/init panic=-1 cma=16M loglevel=7"
vdev pl011
 hostdev >-
 loc 0x1c090000
 intr gic:37
vdev virtio-console
 loc 0x20000000
 intr gic:42
 hostdev /dev/ttyp3
