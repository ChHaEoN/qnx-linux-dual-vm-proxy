name: claims-gate

# Check README.md against the committed tree, and the repo's prose against a
# denylist: every figure README quotes must be re-derived from committed data.
#
# WHY THIS IS THE ONE THAT MATTERS. This project's rule is "never write 'it
# works' without a log, a number, or a diff". That rule catches a number that
# was never measured. It does not catch a number that was true when written and
# drifted afterwards -- a figure edited in prose, a data file appended to, a
# claim carried past the run it came from. Two figures once published in this
# repo were found wrong that way, by hand. This job makes that class of error
# fail the build.
#
# NO RESULTS ARE PUBLISHED (2026-09-27). Clause 4.6(i) of the QNX licence
# (NC QDL v7) bars making evaluation results available to a third party without
# BlackBerry's written approval, so the run data is held locally and README
# quotes no figure. The gate enforces that: a number with a unit in README fails
# unless a claim re-derives it from committed data.
#
# NO MEASUREMENT HAPPENS HERE, and that is deliberate. A GitHub-hosted runner
# is shared, virtualised x86_64 hardware, unlike the board this project targets.
# Any timing taken here would be meaningless and dangerous -- it would look like
# a result. This job only checks text, and recomputes arithmetic over committed
# data where a claim has any. It never gates on an absolute number.
#
# NO QNX. Nothing here builds, links or boots anything QNX; the licence forbids
# it on public runners and no QNX artefact exists in this repo.

on:
  push:
  pull_request:
  # The repository description lives in GitHub settings, not in the tree, so it
  # can drift without any commit touching it. A weekly run catches that.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The results guard compares the pushed tree with the one before it
          # and reads the pushed commits' messages, so it needs the history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # PULL REQUESTS: hermetic. No network, so a PR can only fail on its own
      # diff -- never on a repository-settings change the contributor did not
      # make and cannot fix. The pinned description in docs/repo-description.md
      # still gets the full denylist and figure verification here.
      - name: Check README figures and prose against the tree (hermetic)
        if: github.event_name == 'pull_request'
        # The gate prints a claimed-vs-recomputed table and every section's
        # verdict to this log on every run, pass or fail, so a human reviewer
        # can read the check itself and not merely its exit status.
        run: python scripts/ci/claims_gate.py --repo . --no-network

      # PUSH, SCHEDULE, MANUAL: additionally compare the live GitHub "About"
      # field against the pin and FAIL on drift. This is the failure class the
      # gate could not see before -- the description described an AWS Graviton
      # cloud twin for weeks while README and findings.md said no cloud leg was
      # ever built, and nothing was looking at it.
      - name: Check README figures and prose, and the live description
        if: github.event_name != 'pull_request'
        env:
          # Without this the API call is unauthenticated and hits the shared
          # rate limit. If it fails anyway the gate prints SKIPPED and says in
          # so many words that this is NOT a pass.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ci/claims_gate.py --repo .

      # RESULTS GUARD. README is the claims gate's; this covers the routes a
      # result took to main before 2026-09-28 without anyone checking: a
      # harness's "WHAT IS KNOWN." section, the docs, and commit messages. On a
      # push it runs after publication, so it reports rather than prevents --
      # scripts/githooks/pre-push runs the same check before anything leaves
      # the machine. Without a base (schedule, manual) it checks paths only.
      - name: No measured result in the tree or the commit messages
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=""
          if [ "$EVENT" = pull_request ]; then base="$PR_BASE"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then base="$BEFORE"
          fi
          if [ -n "$base" ]; then
            python scripts/ci/results_guard.py --repo . --base "$base" --commits "$base..HEAD"
          else
            python scripts/ci/results_guard.py --repo .
          fi

      - name: Phase badge must match the status table
        # The badge and the table were two hand-maintained copies of one fact
        # and they drifted -- the badge once announced a phase the table had
        # long passed, and later an architecture that had been superseded.
        # The table is the single source of truth; this check makes divergence
        # a build failure instead of a stale image.
        run: python scripts/ci/render_badges.py --check

      - name: Summarise for the PR page
        if: always()
        run: |
          {
            echo '## Claims gate'
            echo
            echo 'README.md quotes no measured or functional result (NC QDL v7'
            echo '4.6(i)): any number with a unit in it fails unless a claim'
            echo 're-derives it from committed data. The full report is in the'
            echo 'job log above.'
            echo
            echo 'This gate checks text and arithmetic over committed data.'
            echo 'It never measures anything itself and never gates on an'
            echo 'absolute number -- a shared public runner cannot produce a'
            echo 'meaningful timing for this target.'
            echo
            echo '### Repository description'
            echo
            echo 'The GitHub "About" field is pinned in `docs/repo-description.md`'
            echo 'and gets the same denylist and the same figure verification as'
            echo 'README. On push and on the weekly run the live value is compared'
            echo 'against the pin and drift fails the build; pull requests run'
            echo 'hermetically so they cannot fail on a settings change. If the'
            echo 'API is unreachable the job prints SKIPPED, which is not a pass.'
            echo
            echo '### Results guard'
            echo
            echo 'No run record, CSV or boot log may be in the tree. A figure that a'
            echo "change adds to a harness's WHAT IS KNOWN section, to docs/ or to a"
            echo 'README below the root fails, and so does a figure in a pushed commit'
            echo 'message. Design values go into scripts/ci/figure-allowlist.txt with'
            echo 'their reason; scripts/githooks/pre-push runs the same check before'
            echo 'a push.'
          } >> "$GITHUB_STEP_SUMMARY"
