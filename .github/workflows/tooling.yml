name: tooling

# Lint and native tests only. No QNX compiler, binary, header or guest runs here.
# KVM elsewhere boots a startup-qemu-virt that is ours, not a QNX-supported configuration;
# no timing claim attaches to that boot.
# Ruff and mypy's command lines define their coverage. Recorded source copies
# under results/ and scripts/twin/time-kvm-boot.py remain outside that coverage.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    # Pinned, like the tooling below: ubuntu-latest moved to Ubuntu 26.04, where the bare-metal
    # tests of GNU timeout's signal and process-group behaviour fail. The instance's image, and
    # the local WSL run, are Ubuntu 24.04.
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SDV_REQUIRE_GEN: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned so a new release cannot turn a green PR red without a commit.
      - name: Install tooling
        run: python -m pip install --disable-pip-version-check ruff==0.16.8 pytest==9.1.1 mypy==1.18.2

      # The rule selection and its rationale are in pyproject.toml.
      - name: ruff
        run: ruff check --output-format=github tests sdv orin-native scripts/ci scripts/aws scripts/twin

      - name: mypy
        # Non-strict: a regression guard against syntax-level and obvious call errors.
        # These standalone image builders share a module name. Check each
        # separately so mypy reaches all of them without a duplicate module.
        run: |
          set -euo pipefail
          mypy --no-incremental --exclude '^sdv/(connector|rosvss|carlaif)/build_image\.py$' \
            scripts/ci scripts/aws scripts/twin tests \
            sdv/connector sdv/cloud sdv/ota sdv/carla sdv/feeder sdv/ctl \
            sdv/rosvss sdv/steershim sdv/drill sdv/carlaif \
            sdv/arm64/awscan.py sdv/sim/carla010_iso.py
          for f in sdv/connector/build_image.py sdv/rosvss/build_image.py sdv/carlaif/build_image.py; do
            mypy --no-incremental "$f"
          done

      - name: Read the VSS archive pin
        id: vss-source
        run: |
          python -c 'import ast; from pathlib import Path; t = ast.parse(Path("sdv/vss/generate.py").read_text()); print("sha256=" + next(ast.literal_eval(n.value) for n in t.body if isinstance(n, ast.Assign) and any(isinstance(x, ast.Name) and x.id == "ARCHIVE_SHA256" for x in n.targets)))' >> "$GITHUB_OUTPUT"

      - name: Cache the pinned VSS archive and wheels
        uses: actions/cache@v4
        with:
          path: |
            ~/sdv-cache/vss-v6.0.tar.gz
            ~/.cache/pip
          key: ${{ runner.os }}-py312-vss-${{ steps.vss-source.outputs.sha256 }}-${{ hashFiles('sdv/vss/requirements.lock') }}

      - name: Generate the VSS contracts and twin allowlist
        # The generator checks the source-tag archive's SHA and embedded
        # commit before extraction. Dependencies come only from the hash lock.
        run: |
          set -euo pipefail
          python -m venv "$HOME/sdv-venv"
          "$HOME/sdv-venv/bin/python" -m pip install --disable-pip-version-check \
            --require-hashes --no-deps --only-binary=:all: -r sdv/vss/requirements.lock
          "$HOME/sdv-venv/bin/python" -B sdv/vss/generate.py
          "$HOME/sdv-venv/bin/python" -B sdv/connector/gen_allowlist.py
          "$HOME/sdv-venv/bin/python" -B sdv/connector/gen_allowlist.py --check

      - name: pytest
        # These opt-in files and the Windows-only case skip by their own marks;
        # they are left out here so the hosted report lists only tests that can run.
        # Git tests DO run here: a checkout on GitHub has usable native git.
        run: |
          pytest -q -rfEs -o addopts= -p no:cacheprovider --junitxml=sdv-out/pytest.xml \
            --ignore=tests/test_sdv_connector_probe.py \
            --ignore=tests/test_sdv_connector_broker.py \
            --ignore=tests/test_sdv_burst_broker.py \
            --deselect=tests/test_sdv_cloud.py::test_docker_path_reads_a_drive_path_for_a_prefix_whose_first_word_is_wsl_and_for_no_other

      - name: Require the twin exclusion tests and monitor guard
        run: python -B tests/twin_gate.py sdv-out/pytest.xml

      - name: No QNX artefact may enter CI or fixtures
        # A licence check, enforced rather than promised. If a QNX-derived
        # binary is ever added under .github/ or tests/, this fails the build.
        run: |
          set -euo pipefail
          if find .github tests -type f \
               \( -name '*.ifs' -o -name '*.bin' -o -name '*.sym' -o -name '*.kimg' \
                  -o -name '*.so' -o -name '*.a' -o -name '*.o' \) | grep . ; then
            echo "::error::a binary artefact was found under .github/ or tests/"
            exit 1
          fi
          echo "ok: no binary or QNX-derived artefact under .github/ or tests/"
