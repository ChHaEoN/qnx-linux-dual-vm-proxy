# sensor_mapping_sdv.yaml -- the project's sensor mapping for CARLA 0.10.0's interface at the pin (sdv/carlaif; SDV Phase 8
# WP9 P2).
#
# The WP9 specification's 2.4 and section 1's items 5 and 7 (the project's local design
# notes; not in this tree). Written in JSON, which is YAML, so that the tests read it without PyYAML; comments only
# above the body.
#
# An IMU and a GNSS and nothing else (D21): the pinned loader refuses a mapping without sensor_mappings and
# enabled_sensors, and the interface refuses one that enables no sensor, so it has these two, whose entries are the
# pin's light-weight mapping's, unchanged. Nothing consumes their topics with sensing off. default_sensor_kit_name and
# normalization are that mapping's too. vehicle_config.wheelbase is not the taxi's wheelbase: the interface places
# base_link wheelbase / 2 behind the actor's origin, and 2.53 is twice sdv/carla/town10.py's BASE_LINK_OFFSET_M (1.265 m),
# the taxi's zero-lateral-slip point.
{
  "default_sensor_kit_name": "carla_sensor_kit_description",
  "sensor_mappings": {
    "tamagawa/imu_link": {
      "carla_type": "sensor.other.imu",
      "id": "imu",
      "ros_config": {
        "frame_id": "tamagawa/imu_link",
        "topic": "/sensing/imu/tamagawa/imu_raw",
        "frequency_hz": 50,
        "qos_profile": "reliable"
      },
      "parameters": {
        "noise_accel_stddev_x": 0.0,
        "noise_accel_stddev_y": 0.0,
        "noise_accel_stddev_z": 0.0,
        "noise_gyro_stddev_x": 0.0,
        "noise_gyro_stddev_y": 0.0,
        "noise_gyro_stddev_z": 0.0
      }
    },
    "gnss_link": {
      "carla_type": "sensor.other.gnss",
      "id": "gnss",
      "ros_config": {
        "frame_id": "map",
        "topic": "/sensing/gnss/pose_with_covariance",
        "frequency_hz": 2,
        "qos_profile": "reliable"
      },
      "parameters": {
        "noise_alt_stddev": 0.0,
        "noise_lat_stddev": 0.0,
        "noise_lon_stddev": 0.0,
        "noise_alt_bias": 0.0,
        "noise_lat_bias": 0.0,
        "noise_lon_bias": 0.0
      },
      "covariance": {
        "position_variance": 0.01,
        "orientation_variance": 1.0
      }
    }
  },
  "normalization": {
    "strip_suffixes": ["_base_link", "_link", "/camera_link"]
  },
  "vehicle_config": {
    "wheelbase": 2.53
  },
  "enabled_sensors": ["tamagawa/imu_link", "gnss_link"]
}
