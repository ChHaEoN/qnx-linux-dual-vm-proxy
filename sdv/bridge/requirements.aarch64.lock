# requirements.aarch64.lock -- the claim bridge image's Python packages for linux/arm64 (sdv/bridge; SDV Phase 3 WP0)
#
# Project-written. The arm64 twin of requirements.lock: the same 25 names and versions in the same order
# (tests/test_sdv_arm64.py holds them equal), and so exactly the union of the two aarch64 locks this branch holds,
# sdv/apps/hard-brake-hazard/requirements.aarch64.lock and sdv/sim/requirements.aarch64.lock, every shared pin equal
# (tests/test_sdv_bridge_sources.py). Every file is a wheel for CPython 3.12, Linux aarch64 (the arm64 manifest of the
# pinned python:3.12-slim base, sdv/stack/images.json base.python.arm64_manifest). The py3-none-any wheels are
# requirements.lock's files with their hashes; grpcio, grpcio-tools, protobuf, websockets, wcwidth, bitstruct and wrapt
# are their cp312 or abi3 manylinux aarch64 wheels. sdv/bridge/build_image.py --arch arm64 stages this file as the
# build context's requirements.lock, where the Dockerfile installs it with
#     pip install --require-hashes --no-deps --only-binary=:all: -r requirements.lock
# so pip installs these files and nothing else. Resolved 2026-10-02 with pip download --platform manylinux2014_aarch64
# --python-version 3.12 --implementation cp --abi cp312 --only-binary=:all: --no-deps, each file's sha256 equal to the
# digest PyPI publishes for it.
