# requirements.lock -- the claim bridge image's Python packages (sdv/bridge; Phase 2 WP7)
#
# Project-written. Exactly the union of two locks this branch already holds, with their pins and hashes
# unchanged (tests/test_sdv_bridge_sources.py holds every shared pin equal and the union exact):
#   sdv/apps/hard-brake-hazard/requirements.lock  kuksa-client 0.6.0 (the plan's pin) and its resolution,
#                                                 the same as the recorder image's;
#   sdv/sim/requirements.lock                     cantools 44.1.0 and python-can 4.6.1 and their resolution.
# The two overlap in typing-extensions only, at the same version and hash. Every file is a wheel for
# CPython 3.12, Linux x86_64 (the pinned python:3.12-slim base); installed with
#     pip install --require-hashes --no-deps --only-binary=:all: -r requirements.lock
# so pip installs these files and nothing else. An arm64 image needs its own resolution (grpcio,
# grpcio-tools, protobuf, websockets, wcwidth, bitstruct and wrapt ship per-platform wheels).
