# requirements.aarch64.lock -- the VSS-layer recorder image's Python packages for linux/arm64 (sdv/stack/recorder)
#
# Project-written (SDV Phase 3 WP0). The same pinned versions and hashes as
# sdv/apps/hard-brake-hazard/requirements.aarch64.lock (tests/test_sdv_stack.py holds the pins equal), and the
# same names and versions as this directory's requirements.lock (tests/test_sdv_arm64.py): kuksa-client 0.6.0
# (the plan's pin; the csv-provider repository's requirements.txt at commit 30a92880 declares ~= 0.5.2 and
# recorder.py itself names no version) and everything pip resolves for it, each with the sha256 of the one wheel
# pip installs for it on CPython 3.12, Linux aarch64 (the arm64 manifest of the pinned python:3.12-slim base).
# The py3-none-any wheels are requirements.lock's files with their hashes; grpcio, grpcio-tools, protobuf,
# websockets and wcwidth are their cp312 or abi3 manylinux aarch64 wheels. sdv/stack/stack.py's
# build_local_arm64 stages this file as the build context's requirements.lock, where the Dockerfile installs it with
#     pip install --require-hashes --no-deps --only-binary=:all: -r requirements.lock
# so pip installs these files and nothing else. Resolved 2026-10-02 with pip download for cp312
# manylinux2014_aarch64, each file's sha256 equal to the digest PyPI publishes for it.
