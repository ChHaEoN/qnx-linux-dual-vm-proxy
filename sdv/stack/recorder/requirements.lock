# requirements.lock -- the VSS-layer recorder image's Python packages (sdv/stack/recorder)
#
# Project-written. The same pinned versions and hashes as sdv/apps/hard-brake-hazard/requirements.lock
# (tests/test_sdv_stack.py holds the pins equal), kept as its own file because the recorder is a
# platform component and the app is not: kuksa-client 0.6.0 (the plan's pin; its wheel sha256 equals
# the Phase 0 pin; the csv-provider repository's requirements.txt at commit 30a92880 declares ~= 0.5.2
# and recorder.py itself names no version) and
# everything pip resolves for it on CPython 3.12, Linux x86_64 (the pinned python:3.12-slim
# base), exact versions, the sha256 of the one wheel each. Installed with
#     pip install --require-hashes --no-deps --only-binary=:all: -r requirements.lock
# so pip installs these files and nothing else. Resolved 2026-09-30 with pip download for
# cp312 manylinux x86_64; an arm64 build needs its own resolution (grpcio, grpcio-tools, protobuf,
# websockets and wcwidth ship per-platform wheels).
