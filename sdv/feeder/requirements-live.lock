# requirements-live.lock -- the environment sdv/feeder/live.py runs in, in WSL: the carla 0.9.16 client
# (the CPython 3.12 manylinux wheel, pinned by its PyPI sha256; it declares no dependency), and cantools
# 44.1.0 and python-can 4.6.1 with every package pip resolved for the two, each pinned exactly as
# sdv/sim/requirements.lock pins it, with the same sha256. Nothing else. Each hash is that of the one
# file pip installs on WSL Ubuntu-24.04, CPython 3.12, x86_64; on any other platform pip finds no file
# with a listed hash and stops: that is intended.
#
# A venv of its own, ~/sdv-carla-venv: neither the sim venv (sdv/sim/requirements.lock, which holds no
# carla) nor the vss-tools venv. No container: the feeder runs on the PC only, and the hosts replay
# recordings (sdv/feeder/README.md).
#
# Build (sdv/feeder/README.md):
#   python3 -m venv ~/sdv-carla-venv
#   ~/sdv-carla-venv/bin/pip install --require-hashes --no-deps -r sdv/feeder/requirements-live.lock
#
# --no-deps makes this file the whole resolution: a transitive dependency missing here fails the
# install instead of being fetched unpinned. Regenerate only when a pin changes, and record why.
