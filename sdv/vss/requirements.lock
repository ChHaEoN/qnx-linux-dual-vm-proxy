# requirements.lock -- the environment sdv/vss/generate.py runs in: vss-tools 6.0.0 (the version
# the VSS v6.0 tag's own install script names) and every package pip resolved for it, each pinned
# exactly, with the sha256 of the one file pip installs for it on WSL Ubuntu-24.04, CPython 3.12,
# x86_64. On any other platform pip finds no file with a listed hash and stops: that is intended.
#
# Build (README.md):
#   python3 -m venv ~/sdv-venv
#   ~/sdv-venv/bin/pip install --require-hashes --no-deps -r sdv/vss/requirements.lock
#
# generate.py refuses to run when the venv's installed versions differ from these pins.
# Regenerate only when a pin changes, and record why (README.md, 'Changing a pin').
