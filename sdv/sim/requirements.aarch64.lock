# requirements.aarch64.lock -- the arm64 twin of requirements.lock: the environment sdv/sim/sigsim.py and the
# stack's host side run in on an aarch64 Linux host (SDV Phase 3: a1.metal), with the same names and versions in the
# same order (tests/test_sdv_arm64.py holds them equal), each with the sha256 of the one file pip installs for it on
# CPython 3.12, Linux aarch64. The py3-none-any wheels are requirements.lock's files with their hashes; bitstruct and
# wrapt are their cp312 manylinux aarch64 wheels. On any other platform pip finds no file with a listed hash and
# stops: that is intended.
#
# Build (on the aarch64 host, with a CPython 3.12):
#   python3.12 -m venv ~/sdv-sim-venv
#   ~/sdv-sim-venv/bin/pip install --require-hashes --no-deps -r sdv/sim/requirements.aarch64.lock
#
# --no-deps makes this file the whole resolution, as for requirements.lock. Resolved 2026-10-02 with pip download
# --platform manylinux2014_aarch64 --python-version 3.12 --implementation cp --abi cp312 --only-binary=:all:
# --no-deps, each file's sha256 equal to the digest PyPI publishes for it.
