# requirements.lock -- the twin connector image's Python packages (sdv/connector; SDV Phase 4 WP0)
#
# Project lock. Exactly sdv/apps/hard-brake-hazard/requirements.lock's 17 pins, unchanged (kuksa-client 0.6.0,
# the plan's pin, and its resolution; tests/test_sdv_connector.py holds every shared pin equal in version, sha256 and
# file), plus two: awsiotsdk 1.31.0, the device SDK the connector's uplink is built on, and awscrt 0.36.1, the one
# version that SDK wheel declares (Requires-Dist: awscrt==0.36.1; sdk-requires.json records the wheel's metadata, a
# test holds this lock to it and lockcheck.py reads the wheel again: --no-deps below would hide a mismatch). Made with
# the app lock as constraints, not resolved fresh: a fresh resolve would move a shared pin away from the other images'.
# Every file is a wheel for CPython 3.12, Linux x86_64 (the pinned python:3.12-slim base, sdv/stack/images.json
# base.python); awscrt ships no cp312 wheel and CPython 3.12 takes its cp311 stable-ABI one. To be installed with
#     pip install --require-hashes --no-deps --only-binary=:all: -r requirements.lock
# so pip installs these files and nothing else. No image is built from this file before Phase 4 WP3. Checked
# 2026-10-04 with pip download --require-hashes for cp312 and abi3 manylinux x86_64, each file's sha256 equal to the
# digest PyPI publishes for it.
